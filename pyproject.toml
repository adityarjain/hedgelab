[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgelab"
version = "0.1.0"
description = "Options hedging research on real SPY data: pricing, volatility forecasting, deep hedging, backtesting"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "yfinance", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["hedgelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]
