[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgelab"
version = "0.1.0"
description = "Options hedging research on real SPY data: pricing, volatility forecasting, deep hedging, backtesting"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "yfinance", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["hedgelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model or runs a long simulation (CI skips: pytest -m 'not slow')"]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pycodestyle, pyflakes, import order, bugbear, pyupgrade
